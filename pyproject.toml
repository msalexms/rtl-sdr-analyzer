[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl-sdr-analyzer"
dynamic = ["version"]
description = "Real-time RF spectrum analyzer, signal detector, and wideband sweeper by AMSTech"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Alejandro Martín (AMSTech)", email = "info@amstech.dev" },
]
keywords = ["rtl-sdr", "spectrum-analyzer", "rf", "dsp", "sdr", "amstech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "structlog>=24.0,<25.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-PyYAML>=6.0,<7.0",
]
bundle = [
    "pyinstaller>=6.10,<7.0",
]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
rtl-sdr-analyzer = "rtl_sdr_analyzer.cli.app:app"

[project.urls]
Homepage = "https://github.com/msalexms/rtl-sdr-analyzer"
Repository = "https://github.com/msalexms/rtl-sdr-analyzer"
Issues = "https://github.com/msalexms/rtl-sdr-analyzer/issues"

[tool.setuptools.dynamic]
version = { attr = "rtl_sdr_analyzer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rtl_sdr_analyzer = [
    "py.typed",
    "web/static/*",
    "web/static/**/*",
    "web/static/**/**/*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "B904", "SIM115", "N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
disable_error_code = ["type-arg", "import-untyped", "unused-ignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=rtl_sdr_analyzer --cov-report=term-missing --cov-fail-under=75"
asyncio_mode = "auto"
