services:
  rtl-sdr-analyzer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rtl-sdr-analyzer
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    volumes:
      - ../data:/data
      - ../recordings:/recordings
    environment:
      - RTL_SDR__SOURCE__MODE=auto
      - RTL_SDR__RECEIVER__FREQUENCY=98000000
      - RTL_SDR__STORAGE__DB_PATH=/data/events.db
      - RTL_SDR__STORAGE__RECORDINGS_DIR=/recordings

  rtl-tcp:
    image: alpine:latest
    container_name: rtl-tcp
    profiles: ["rtl-tcp"]
    restart: unless-stopped
    ports:
      - "1234:1234"
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    entrypoint: >
      sh -c "apk add --no-cache rtl-sdr && rtl_tcp -a 0.0.0.0 -p 1234"
