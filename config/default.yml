source:
  mode: "auto" # auto | usb | rtl_tcp | simulated | file
  device_index: 0

rtl_tcp:
  host: "127.0.0.1"
  port: 1234
  connect_timeout: 5.0
  read_timeout: 2.0

receiver:
  frequency: 98000000 # 98.0 MHz (FM broadcast)
  sample_rate: 2048000 # 2.048 MSPS
  fft_size: 2048
  gain: null # null = auto gain, or dB (e.g. 29.7)
  ppm: 0
  direct_sampling: 0 # 0 = off, 1 = I-ADC, 2 = Q-ADC
  agc: false

dsp:
  window: "blackmanharris"
  averaging: 4
  ema_alpha: 0.35
  remove_dc: true

detector:
  enabled: true
  power_threshold: -55.0
  snr_threshold: 10.0
  bandwidth_threshold: 5000.0
  z_score_threshold: 3.0
  detection_window: 5
  min_duration: 0.2
  holdover_seconds: 0.5
  cooldown_seconds: 2.0
  test_mode: false

display:
  waterfall_length: 120
  target_fps: 20

web:
  host: "127.0.0.1"
  port: 8080

storage:
  db_path: null
  recordings_dir: "./recordings"
